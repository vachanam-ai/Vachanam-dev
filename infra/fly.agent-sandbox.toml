# VOICE LATENCY SANDBOX — Smallest STT + Gemini + Cartesia TTS (Vinay 2026-08-11).
#
# Cartesia TTS already collected the TTS half: 509ms -> 97ms measured, because
# that half really was the Tokyo round trip.
#
# The STT half is NOT geography. Benched from this worker (scripts/benchmark_stt.py,
# n=9 each): Soniox JP med 413ms with only +/-10ms run-to-run spread, in-region
# Sarvam med 721ms. A deterministic ~400ms with no jitter is an ENDPOINTING
# decision, not a round trip, which is why moving the vendor to India made it
# worse. Sarvam, Deepgram (accuracy, Vinay) and Cartesia STT (reverted b1fca10)
# are all closed.
#
# Smallest Pulse is the remaining candidate because it exposes eou_timeout_ms
# (100ms default) instead of a heuristic endpointer — it attacks the component
# that is actually costing us. Telugu is BETA there; this sandbox exists to find
# out whether that matters on a real call before anything reaches production.
#
# A SEPARATE Fly app running the SAME code as production with env vars
# flipped. Nothing here can affect the live line:
#
#   * different app        -> its own machine, its own deploys
#   * different agent name -> LiveKit dispatches to it only when a rule names
#                             `vachanam-sandbox`. Sharing the production name
#                             would make both workers eligible for the same
#                             call, which is how a "sandbox" ends up answering
#                             real patients.
#   * explicit provider env -> Sarvam STT + Cartesia TTS inside this worker
#
# Deploy:  flyctl deploy --config infra/fly.agent-sandbox.toml --remote-only
# Secrets: flyctl secrets set -a vachanam-agent-sandbox SARVAM_API_KEY=... CARTESIA_API_KEY=... \
#            (plus the same LiveKit/DB/Redis/Gemini secrets as the prod app)
#
# Routing a real number to it is a DELIBERATE, reversible step — see
# docs/runbooks/tts-cartesia-sandbox.md. It is not done by deploying this.
app = "vachanam-agent-sandbox"
# Co-located in Mumbai with LiveKit India West and Vertex asia-south1.
primary_region = "bom"

[build]
  dockerfile = "Dockerfile.agent"

[env]
  APP_ENV = "production"     # same code path; provider switches are explicit
  LOG_LEVEL = "info"
  # Smallest Pulse STT was evaluated on a real call 2026-08-11 (session dda1e4ad,
  # 14 turns) and REVERTED. stt_finalize p50 762ms vs 409ms on Soniox, total p50
  # 1737ms — worse than production's 1653ms, so it ate the entire Cartesia TTS
  # win. It also stalled audibly mid-call: one turn at 4388ms with 2892ms
  # unaccounted, another with a 1306ms playout gap and no transcript at all.
  # Its STT metrics fire every 5.00s regardless of speech, so an utterance that
  # ends just past a window boundary waits for the next window to close.
  # Do not re-try Smallest without evidence that windowing changed.
  STT_PROVIDER = "soniox"
  TTS_PROVIDER = "cartesia"
  LLM_PROVIDER = "gemini"
  CARTESIA_VOICE = "07bc462a-c644-49f1-baf7-82d5599131be"
  CARTESIA_MIN_SENTENCE_LEN = "4"
  CARTESIA_SAMPLE_RATE = "24000"
  VOICE_ENDPOINTING_MIN_DELAY_S = "0"
  VOICE_ENDPOINTING_MAX_DELAY_S = "0.06"
  SONIOX_MANUAL_FINALIZE_DELAY_MS = "200"
  VOICE_NUM_IDLE_PROCESSES = "1"
  LIVEKIT_AGENT_NAME = "vachanam-sandbox"
  # Vertex context caching OFF (Vinay 2026-08-12). Measured over 1,529 turns it
  # buys NO latency — llm_ttft p50 556ms with cache_hit=True vs 563ms without —
  # while storage costs ~Rs650/mo per clinic-language, which only pays for
  # itself above ~660 talk-minutes/month. This sandbox exists to confirm the
  # plain path is indistinguishable on a real call before production follows.
  VOICE_PROMPT_CACHE = "0"
  # LLM prewarm OFF pending diagnosis (Vinay reported the agent stopped
  # understanding intent on the first call after it shipped, 2026-08-12).
  # Suspect: the warm runs asyncio.run() on a daemon thread, which CLOSES that
  # event loop on exit while the shared proc.userdata["llm"] client may have
  # bound its connection to it. Cache-off alone ran 7 clean turns earlier
  # (session 77354351), so the prewarm is the new variable.
  VOICE_LLM_PREWARM = "0"
  VOICE_TOOL_PREFETCH = "true"
  VOICE_DETERMINISTIC_CONFIRM = "true"
  MAX_CALL_DURATION_SECONDS = "600"
  # Vobiz records investor test calls.  Do not also run LiveKit's admin-only
  # recorder: its mandatory notice serializes ahead of the normal intro and
  # added several seconds to the measured opening path.
  RECORDING_ENABLED = "false"
  TRANSCRIPT_CAPTURE_ENABLED = "true"
  TRANSCRIPT_RETENTION_DAYS = "30"
  # The sandbox must never send patients real messages or drive the follow-up
  # loop — it exists to be listened to.
  VOICE_GREET_BY_NAME = "1"

[deploy]
  strategy = "immediate"     # a sandbox has no availability promise to keep

# Match the production-proven worker shape and preserve per-call headroom.
# Cold inference warmup measured about 67 seconds on both tested CPU shapes;
# routing is therefore gated on an actual LiveKit registration, not Fly state.
[[vm]]
  cpu_kind = "shared"
  cpus = 4
  memory_mb = 4096
