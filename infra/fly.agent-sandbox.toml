# VOICE LATENCY SANDBOX — Sarvam STT + Cartesia TTS (Vinay 2026-08-11).
#
# Aggressive latency reduction: Sarvam STT (regional India) replaces Soniox Japan
# (383ms), Cartesia TTS replaces Soniox Japan TTS (509ms). Measured baseline
# today: Soniox STT+TTS = 892ms = 52% of end-to-end latency. Sarvam + Cartesia
# target: ~200-300ms, buying ~600ms on the call path.
#
# A SEPARATE Fly app running the SAME code as production with env vars
# flipped. Nothing here can affect the live line:
#
#   * different app        -> its own machine, its own deploys
#   * different agent name -> LiveKit dispatches to it only when a rule names
#                             `vachanam-sandbox`. Sharing the production name
#                             would make both workers eligible for the same
#                             call, which is how a "sandbox" ends up answering
#                             real patients.
#   * explicit provider env -> Sarvam STT + Cartesia TTS inside this worker
#
# Deploy:  flyctl deploy --config infra/fly.agent-sandbox.toml --remote-only
# Secrets: flyctl secrets set -a vachanam-agent-sandbox SARVAM_API_KEY=... CARTESIA_API_KEY=... \
#            (plus the same LiveKit/DB/Redis/Gemini secrets as the prod app)
#
# Routing a real number to it is a DELIBERATE, reversible step — see
# docs/runbooks/tts-cartesia-sandbox.md. It is not done by deploying this.
app = "vachanam-agent-sandbox"
# Co-located in Mumbai with LiveKit India West and Vertex asia-south1.
primary_region = "bom"

[build]
  dockerfile = "Dockerfile.agent"

[env]
  APP_ENV = "production"     # same code path; provider switches are explicit
  LOG_LEVEL = "info"
  # Cartesia STT (regional HTTP, low-latency vs Soniox JP 383ms).
  STT_PROVIDER = "soniox"
  TTS_PROVIDER = "cartesia"
  LLM_PROVIDER = "gemini"
  CARTESIA_VOICE = "07bc462a-c644-49f1-baf7-82d5599131be"
  CARTESIA_MIN_SENTENCE_LEN = "4"
  CARTESIA_SAMPLE_RATE = "24000"
  VOICE_ENDPOINTING_MIN_DELAY_S = "0"
  VOICE_ENDPOINTING_MAX_DELAY_S = "0.06"
  SONIOX_MANUAL_FINALIZE_DELAY_MS = "200"
  VOICE_NUM_IDLE_PROCESSES = "1"
  LIVEKIT_AGENT_NAME = "vachanam-sandbox"
  VOICE_TOOL_PREFETCH = "true"
  VOICE_DETERMINISTIC_CONFIRM = "true"
  MAX_CALL_DURATION_SECONDS = "600"
  # Vobiz records investor test calls.  Do not also run LiveKit's admin-only
  # recorder: its mandatory notice serializes ahead of the normal intro and
  # added several seconds to the measured opening path.
  RECORDING_ENABLED = "false"
  TRANSCRIPT_CAPTURE_ENABLED = "true"
  TRANSCRIPT_RETENTION_DAYS = "30"
  # The sandbox must never send patients real messages or drive the follow-up
  # loop — it exists to be listened to.
  VOICE_GREET_BY_NAME = "1"

[deploy]
  strategy = "immediate"     # a sandbox has no availability promise to keep

# Match the production-proven worker shape and preserve per-call headroom.
# Cold inference warmup measured about 67 seconds on both tested CPU shapes;
# routing is therefore gated on an actual LiveKit registration, not Fly state.
[[vm]]
  cpu_kind = "shared"
  cpus = 4
  memory_mb = 4096
