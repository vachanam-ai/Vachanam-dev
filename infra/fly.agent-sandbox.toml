# TTS SANDBOX — Cartesia instead of Soniox (Vinay 2026-08-07).
#
# A SEPARATE Fly app running the SAME code as production with two env vars
# flipped. Nothing here can affect the live line:
#
#   * different app        -> its own machine, its own deploys
#   * different agent name -> LiveKit dispatches to it only when a rule names
#                             `vachanam-sandbox`. Sharing the production name
#                             would make both workers eligible for the same
#                             call, which is how a "sandbox" ends up answering
#                             real patients.
#   * TTS_PROVIDER=cartesia -> the only behavioural difference under test
#
# Deploy:  flyctl deploy --config infra/fly.agent-sandbox.toml --remote-only
# Secrets: flyctl secrets set -a vachanam-agent-sandbox CARTESIA_API_KEY=... \
#            (plus the same LiveKit/DB/Redis/Gemini secrets as the prod app)
#
# Routing a real number to it is a DELIBERATE, reversible step — see
# docs/runbooks/tts-cartesia-sandbox.md. It is not done by deploying this.
app = "vachanam-agent-sandbox"
# Mumbai had NO CAPACITY for a 4x/4GB machine on 2026-08-07 (twice), so the
# sandbox sits in Singapore. This costs ~40-60ms of extra network latency
# versus prod, so compare VOICE QUALITY here, not response times — for
# latency, read prod's own lat_* metrics instead.
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.agent"

[env]
  APP_ENV = "production"     # same code path as prod; only TTS differs
  LOG_LEVEL = "info"
  TTS_PROVIDER = "cartesia"
  LIVEKIT_AGENT_NAME = "vachanam-sandbox"
  # The sandbox must never send patients real messages or drive the follow-up
  # loop — it exists to be listened to.
  VOICE_GREET_BY_NAME = "1"

[deploy]
  strategy = "immediate"     # a sandbox has no availability promise to keep

# Same shape as prod so latency comparisons mean something: the job process
# loads the same models and needs the same headroom (2x/2GB crash-looped).
[[vm]]
  cpu_kind = "shared"
  cpus = 4
  memory_mb = 4096
