app = "vachanam-agent"
primary_region = "bom"  # Mumbai — lowest latency for India

[build]
  # Relative to THIS config file's dir (infra/). Build context = CWD (repo root),
  # so the Dockerfile's `COPY agent/`/`COPY backend/` still resolve.
  dockerfile = "Dockerfile.agent"

[env]
  APP_ENV = "production"
  LOG_LEVEL = "info"

# The worker dials OUT to LiveKit Cloud and exposes no public HTTP service.
# LiveKit binds a private readiness server on 8081 after inference initializes;
# Fly probes it only to coordinate safe deployments.
[deploy]
  # The LiveKit worker takes ~75-95s to load inference models and bind its
  # internal readiness server. Blue/green keeps the registered worker alive
  # until the replacement passes worker_ready, preventing unanswered calls.
  strategy = "bluegreen"
  wait_timeout = "5m"

[checks]
  [checks.worker_ready]
    type = "tcp"
    port = 8081
    grace_period = "30s"
    interval = "5s"
    timeout = "2s"

# No public [http_service]. Keep exactly one machine running at all times;
# never auto-stop on idle.
[[vm]]
  cpu_kind = "shared"
  # 4 CPU / 4 GB: on 2x/2GB the forked per-call job processes hung loading models
  # and the supervisor killed them on init-timeout (exit -10), crash-looping so
  # inbound calls couldn't be answered. More CPU = model load finishes inside the
  # init timeout; more RAM = headroom for the inference executor + job processes.
  cpus = 4
  memory_mb = 4096

# Secrets (set via: fly secrets set KEY=VALUE)
# OPENAI_API_KEY
# GEMINI_API_KEY
# LIVEKIT_URL
# LIVEKIT_API_KEY
# LIVEKIT_API_SECRET
# VOBIZ_SIP_DOMAIN
# VOBIZ_SIP_USERNAME
# VOBIZ_SIP_PASSWORD
# VOBIZ_DID_NUMBER
# VOBIZ_PARTNER_AUTH_ID
# VOBIZ_PARTNER_AUTH_TOKEN
# DATABASE_URL
# REDIS_URL
# JWT_SECRET
# META_ACCESS_TOKEN
# META_PHONE_NUMBER_ID
# META_WABA_ID
# META_WEBHOOK_VERIFY_TOKEN
# META_APP_SECRET
# GOOGLE_APPLICATION_CREDENTIALS (path inside container)
# GOOGLE_OAUTH_CLIENT_ID
# GOOGLE_OAUTH_CLIENT_SECRET
# GOOGLE_CALENDAR_SERVICE_EMAIL
# ADMIN_PHONE
