app = "vachanam-agent"
# Mumbai is preferred, but Fly reported no 4 GB capacity on 2026-08-17.
# Keep production available in Singapore until a deliberate migration back.
primary_region = "sin"

[build]
  # Relative to THIS config file's dir (infra/). Build context = CWD (repo root),
  # so the Dockerfile's `COPY agent/`/`COPY backend/` still resolve.
  dockerfile = "Dockerfile.agent"

[env]
  APP_ENV = "production"
  LOG_LEVEL = "info"
  # Production voice profile, promoted from the isolated Soniox canary after
  # real PSTN measurements. Keep these non-secret controls in source control so
  # a stale Fly secret cannot silently put callers on a different latency path.
  STT_PROVIDER = "soniox"
  TTS_PROVIDER = "soniox"
  # PSTN exposes an 8 kHz speech band. Soniox at 16 kHz retains all available
  # phone detail while the canary measured lower first-audio latency than 24 kHz.
  SONIOX_TTS_SAMPLE_RATE = "16000"
  # Soniox supplies the authoritative semantic endpoint. These LiveKit values
  # add virtually no second wait after the provider finalizes the transcript.
  # REVERTED from 0/0.06 on 2026-08-12. At a 60ms endpoint the agent decided
  # the caller had finished during a normal mid-sentence pause. Two live
  # symptoms, one cause:
  #   * the caller's question was truncated and the agent answered a fragment
  #     ("అంటే, మీ దగ్గర ఎవరైనా డాక్టర్" — session 6a3695d7)
  #   * the agent started replying too early, was genuinely interrupted, and
  #     regenerated the whole sentence, which sounds like it repeating itself
  #     ("agent: ఈరోజు" then the full line — production session 76d3771498147559)
  # Sandbox measured the fix at +81ms per turn, and the call went from 2 turns
  # to 11. This is the STT endpoint tuning the latency guardrails ban; do not
  # lower it again without real-call evidence.
  VOICE_ENDPOINTING_MIN_DELAY_S = "0.05"
  VOICE_ENDPOINTING_MAX_DELAY_S = "0.30"
  # Quality-safe Soniox profile: level 1 plus a cancellable 200 ms local-VAD
  # finalize. Sensitivity intentionally stays unset after the earlier aggressive
  # experiment fragmented Telugu names and times.
  SONIOX_ENDPOINT_LATENCY_LEVEL = "1"
  SONIOX_MAX_ENDPOINT_DELAY_MS = "2000"
  SONIOX_MANUAL_FINALIZE_DELAY_MS = "200"
  # Keep four processes prewarmed: concurrent callers must never wait for the
  # roughly minute-long model/process initialization observed on a cold spawn.
  VOICE_NUM_IDLE_PROCESSES = "4"
  # Explicit Vertex CachedContent costs token-hours per clinic/language. Latest
  # production cohort: cached p50 1623ms vs uncached 1579ms, so it is both more
  # expensive and no faster here. Keep the feature available for a future
  # high-volume A/B, but make this deployment decision explicit.
  VOICE_PROMPT_CACHE = "0"
  VOICE_TOOL_PREFETCH = "true"
  VOICE_DETERMINISTIC_CONFIRM = "true"

# The LiveKit worker dials OUT to LiveKit Cloud and registers as a worker; it
# serves NO inbound HTTP (the old http_service internal_port=8080 pointed at the
# retired Pipecat/Vobiz uvicorn app — finding #32). The machine must stay warm
# (a voice agent must never cold-start) so we keep it always-running and let Fly's
# default process check cover liveness — there is no HTTP endpoint to probe.
[deploy]
  # The organization quota is 4 GB and this single machine uses all 4 GB.
  # Rolling needs a second 4 GB VM and can destroy the old machine after the
  # replacement fails. Immediate accepts a brief restart without that risk.
  strategy = "immediate"

# No [http_service]: this process has no listening socket. Keep exactly one
# machine running at all times; never auto-stop on idle.
[[vm]]
  cpu_kind = "shared"
  # 4 CPU / 4 GB: on 2x/2GB the forked per-call job processes hung loading models
  # and the supervisor killed them on init-timeout (exit -10), crash-looping so
  # inbound calls couldn't be answered. More CPU = model load finishes inside the
  # init timeout; more RAM = headroom for the inference executor + job processes.
  cpus = 4
  memory_mb = 4096

# Secrets (set via: fly secrets set KEY=VALUE)
# SARVAM_API_KEY
# OPENAI_API_KEY
# GEMINI_API_KEY
# LIVEKIT_URL
# LIVEKIT_API_KEY
# LIVEKIT_API_SECRET
# VOBIZ_SIP_DOMAIN
# VOBIZ_SIP_USERNAME
# VOBIZ_SIP_PASSWORD
# VOBIZ_DID_NUMBER
# VOBIZ_PARTNER_AUTH_ID
# VOBIZ_PARTNER_AUTH_TOKEN
# DATABASE_URL
# REDIS_URL
# JWT_SECRET
# META_ACCESS_TOKEN
# META_PHONE_NUMBER_ID
# META_WABA_ID
# META_WEBHOOK_VERIFY_TOKEN
# META_APP_SECRET
# GOOGLE_APPLICATION_CREDENTIALS (path inside container)
# GOOGLE_OAUTH_CLIENT_ID
# GOOGLE_OAUTH_CLIENT_SECRET
# GOOGLE_CALENDAR_SERVICE_EMAIL
# ADMIN_PHONE
